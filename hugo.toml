baseURL = 'https://matthewdeanmartin.github.io/mistersql/'
locale = 'en-us'
title = 'Mistersql'
theme = 'ananke'

# Real-data preview pages are a local, ignored quarantine from the importer
# development phase. The tracked public corpus supersedes them; do not make
# Hugo parse 15,000 duplicate pages on every build.
ignoreFiles = ['(?i)[/\\]posts[/\\]imported[/\\]']

[pagination]
  pagerSize = 40

[services]
  [services.rss]
    # Cap the feed. Hugo's default is -1 (every page on the site), which for an
    # archive this size produced a 10MB index.xml carrying 4,052 items — the
    # entire imported Mastodon corpus, oldest entries included.
    #
    # That is not a theoretical waste. A subscribed reader fetches the whole
    # thing on every poll, and one client (Mawkingbird) took the feed at its
    # word, adapted every entry into a post and tried to render the lot, which
    # locked its tab up. An RSS feed is a "what's new" notice, not a database
    # dump: the archive is what the site itself is for, and every reader already
    # has a link to it.
    #
    # Keep the feed bounded even as the archive grows. The feed is a "what's
    # new" notice, not a database dump; 80 is the hard maximum for every RSS
    # feed Hugo generates from this site.
    limit = 80

[outputs]
  # Keep one site-wide RSS feed. Per-section and per-hashtag feeds multiply
  # build output without adding value to this archive.
  home = ['HTML', 'RSS']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[menus]
  # Without these the interactions section is unreachable: the pages generate,
  # but nothing on the site links to them.
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 10
  [[menus.main]]
    name = 'Interactions'
    pageRef = '/interactions'
    weight = 20

[security]
  # The interactions content adapter (content/interactions/_content.gotmpl)
  # builds each page's body as HTML so it can carry the microformat classes
  # (u-like-of and friends) a webmention receiver reads. Hugo requires HTML
  # content sources to be allowlisted explicitly.
  # Note this *replaces* the default rather than extending it, so the ordinary
  # Markdown types have to be listed too — omitting them locks out every normal
  # page in content/.
  allowContent = ['text/markdown', 'text/html']

[params]
  # Identity attached to every interaction page as a p-author h-card. Without
  # it, a receiver has nothing to attribute a like to and renders it as an
  # anonymous avatar — which is exactly what happened on the first real
  # webmention this site sent.
  author = 'Matthew Dean Martin'
  handle = 'mistersql'
  description = 'Public posts from Twitter and Mastodon, preserved on a site I control.'
  author_url = 'https://matthewdeanmartin.github.io/'
  # Optional; a URL to a profile photo. Left blank rather than pointing at
  # something that may not exist.
  author_photo = ''

  # Fetch webmention counts in the browser as well as at build time.
  #
  # The static data (data/webmentions/, pulled daily) is the primary source: it
  # works with JS off, is in the HTML, and is archived in git. This adds a live
  # check on top, which only speaks up when webmention.io knows about MORE
  # mentions than the last build captured.
  #
  # Off by default — it is a third-party request on every page view, and the
  # feature it improves is already served statically. Turn on if the daily cron
  # feels too slow.
  webmentions_live = false

  # NOTE: the theme's `ananke.custom_css` route is deliberately not used here.
  # It resolves entries through a partial (AnankeGetResource.html) that this
  # version of the theme does not ship, so a missing resource is silently
  # skipped and the stylesheet never reaches the bundle — no error, no warning.
  # webmentions.css is linked from our own head-additions.html instead.

  # The site identity webmention.io assigned at sign-in.
  #
  # **This is the bare domain, not a path.** webmention.io keys on the domain,
  # so a project site under `…github.io/mistersql/` registers as the domain that
  # hosts it. Verified 2026-08-07 by POSTing a real source/target pair:
  #
  #   matthewdeanmartin.github.io            -> {"status":"queued"}
  #   matthewdeanmartin.github.io_mistersql_ -> 404 invalid_target
  #
  # The underscored form was an earlier registration made by signing in with the
  # subpath URL. It produced an account whose *Domain* column literally read
  # `matthewdeanmartin.github.io_mistersql_` — not a hostname — so it rejected
  # every real URL, including the one it was registered with. Do not go back to
  # it. Identity here is per-domain; the path is irrelevant.
  webmention_io_id = 'matthewdeanmartin.github.io'
  # Half of the reciprocal rel="me" pair IndieAuth checks. The other half is
  # this site's URL in the GitHub profile's Website field; both are required.
  indieauth_github = 'https://github.com/matthewdeanmartin'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
