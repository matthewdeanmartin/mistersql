baseURL = 'https://matthewdeanmartin.github.io/mistersql/'
locale = 'en-us'
title = 'Mistersql'
theme = 'ananke'

[menus]
  # Without these the interactions section is unreachable: the pages generate,
  # but nothing on the site links to them.
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 10
  [[menus.main]]
    name = 'Interactions'
    pageRef = '/interactions'
    weight = 20

[security]
  # The interactions content adapter (content/interactions/_content.gotmpl)
  # builds each page's body as HTML so it can carry the microformat classes
  # (u-like-of and friends) a webmention receiver reads. Hugo requires HTML
  # content sources to be allowlisted explicitly.
  # Note this *replaces* the default rather than extending it, so the ordinary
  # Markdown types have to be listed too — omitting them locks out every normal
  # page in content/.
  allowContent = ['text/markdown', 'text/html']

[params]
  # NOTE: the theme's `ananke.custom_css` route is deliberately not used here.
  # It resolves entries through a partial (AnankeGetResource.html) that this
  # version of the theme does not ship, so a missing resource is silently
  # skipped and the stylesheet never reaches the bundle — no error, no warning.
  # webmentions.css is linked from our own head-additions.html instead.

  # The site identity webmention.io assigned at sign-in.
  #
  # **This is the bare domain, not a path.** webmention.io keys on the domain,
  # so a project site under `…github.io/mistersql/` registers as the domain that
  # hosts it. Verified 2026-08-07 by POSTing a real source/target pair:
  #
  #   matthewdeanmartin.github.io            -> {"status":"queued"}
  #   matthewdeanmartin.github.io_mistersql_ -> 404 invalid_target
  #
  # The underscored form was an earlier registration made by signing in with the
  # subpath URL. It produced an account whose *Domain* column literally read
  # `matthewdeanmartin.github.io_mistersql_` — not a hostname — so it rejected
  # every real URL, including the one it was registered with. Do not go back to
  # it. Identity here is per-domain; the path is irrelevant.
  webmention_io_id = 'matthewdeanmartin.github.io'
  # Half of the reciprocal rel="me" pair IndieAuth checks. The other half is
  # this site's URL in the GitHub profile's Website field; both are required.
  indieauth_github = 'https://github.com/matthewdeanmartin'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
